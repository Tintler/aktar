name: Testler

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Testler yalnizca bunlari ister; pywebview, python-mpv, PyInstaller ve ses/konusma
      # motorlari testlerde kullanilmaz (yoksa ilgili testler atlanir).
      - name: Python paketleri
        run: python -m pip install numpy pypdfium2==5.14.0 Pillow==12.3.0

      # FFmpeg ile uctan uca dublaj/sesli kitap/kare testleri ve PDF testleri icin yazi tipi.
      - name: FFmpeg ve yazi tipi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Testler
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests

  web:
    name: Arayuz derlemesi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
