name: Testler

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: Ubuntu'da da test et
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      # Ubuntu isi ~25 dk suruyor; yalnizca istenince calisir: commit mesajinda [ubuntu]
      # ya da elle calistirmada "Ubuntu'da da test et".
      matrix:
        os: ${{ fromJSON((inputs.ubuntu || contains(github.event.head_commit.message, '[ubuntu]')) && '["windows-latest", "ubuntu-latest"]' || '["windows-latest"]') }}
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Testler yalnizca bunlari ister; pywebview, python-mpv, PyInstaller ve ses/konusma
      # motorlari testlerde kullanilmaz (yoksa ilgili testler atlanir).
      - name: Python paketleri
        run: python -m pip install numpy pypdfium2==5.14.0 Pillow==12.3.0

      # FFmpeg ile uctan uca dublaj/sesli kitap/kare testleri ve PDF testleri icin yazi tipi.
      - name: FFmpeg ve yazi tipi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Testler
        shell: bash
        run: python -m unittest discover -s tests 2>&1 | tee test-output.txt

      # Loglar oturum acmadan gorunmez; basarisiz testlerin ozeti herkese acik not olarak yazilir.
      - name: Basarisiz testleri not olarak goster
        if: failure()
        shell: bash
        run: python tools/ci_annotate.py test-output.txt

  web:
    name: Arayuz derlemesi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
